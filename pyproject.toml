[project]
name = "careerpilot-ai"
version = "0.1.0"
description = "AI Native Career Platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Devashish Shankar" }
]

dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.12.0",
    "pyright>=1.1.400",
    "pytest>=8.4.0",
    "pytest-cov>=6.2.0",
    "pre-commit>=4.2.0",
]

[tool.uv]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

ignore = [
    "UP046",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"